name: Verification Stock Jouets

on:
  schedule:
    # S'exécute automatiquement toutes les 5 minutes en secours
    - cron: '*/5 * * * *'
  repository_dispatch:
    # Permet le déclenchement instantané via le Webhook cron-job.org
    types: [run-scraper]
  workflow_dispatch: # Permet d'exécuter le script à la main pour tester

permissions:
  contents: write # Donne accès au git push pour sauvegarder les logs

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer les dépendances
        run: npm install cheerio

      - name: Exécuter le script de vérification
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node scraper.js

      - name: Commit et Push des logs et données de timing
        if: always() # S'exécute même si le script rencontre un problème
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs_erreurs.json stats_horaires.json
          git commit -m "chore(data): mise a jour des logs et stats horaires" || exit 0
          git push

name: Verification Stock Jouets

on:
  schedule:
    # S'exécute automatiquement toutes les 5 minutes en secours
    - cron: '*/5 * * * *'
  repository_dispatch:
    # Permet le déclenchement instantané via le Webhook cron-job.org
    types: [run-scraper]
  workflow_dispatch: # Permet d'exécuter le script à la main pour tester

permissions:
  contents: write # Donne accès au git push pour sauvegarder les logs

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialiser les fichiers JSON et installer cheerio
        run: |
          [ -f logs_erreurs.json ] || echo "[]" > logs_erreurs.json
          [ -f stats_horaires.json ] || echo "{}" > stats_horaires.json
          npm install cheerio

      - name: Exécuter le script de vérification
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: node scraper.js

      - name: Sauvegarder les logs et statistiques
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): mise a jour des logs et stats horaires"
          file_pattern: "logs_erreurs.json stats_horaires.json"

name: Pokemon Scraper

on:
  schedule:
    - cron: '*/10 6-9 * * *'
    - cron: '*/30 14-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install cheerio playwright playwright-extra puppeteer-extra-plugin-stealth

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Scraper
        run: node src/index.js
        env:
          NTFY_TOPIC_CARTE: ${{ secrets.NTFY_TOPIC_CARTE }}
          NTFY_TOPIC_ETB: ${{ secrets.NTFY_TOPIC_ETB }}
          NTFY_TOPIC_COFFRET: ${{ secrets.NTFY_TOPIC_COFFRET }}
          NTFY_TOPIC_BUNDLE_BLISTER: ${{ secrets.NTFY_TOPIC_BUNDLE_BLISTER }}
          NTFY_TOPIC_30ANS: ${{ secrets.NTFY_TOPIC_30ANS }}

      - name: Save State to GitHub
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@scraper.local"
          git add -f stock_state.json
          git diff --quiet && git diff --staged || git commit -m "Mise à jour des stocks [skip ci]"
          git push

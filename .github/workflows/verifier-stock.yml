name: Verification Stock Jouets

on:
  schedule:
    # S'exécute automatiquement toutes les 5 minutes
    - cron: '*/5 * * * *'
  repository_dispatch:
    # Permet le déclenchement instantané via le Webhook cron-job.org
    types: [run-scraper]
  workflow_dispatch:
    # Permet d'exécuter le script à la main pour tester

permissions:
  contents: write # Donne accès au git push pour sauvegarder les logs et l'état des stocks

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances et initialiser les fichiers JSON
        run: |
          # Initialisation des fichiers sans utiliser les doubles pipes
          if [ ! -f timing_stats.json ]; then echo "{}" > timing_stats.json; fi
          if [ ! -f etat_stocks.json ]; then echo "{}" > etat_stocks.json; fi
          
          # Installation des modules nécessaires
          npm install axios cheerio

      - name: Exécuter le script de vérification
        env:
          # Les secrets définis dans les paramètres du dépôt GitHub
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scraper.js

      - name: Sauvegarder les logs et états
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): mise à jour des états de stock et timings"
          file_pattern: "timing_stats.json etat_stocks.json"

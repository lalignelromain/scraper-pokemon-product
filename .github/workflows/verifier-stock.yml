name: Pokemon Scraper & Backlog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⬡ Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Installation des dépendances
        run: npm install playwright cheerio dotenv

      - name: 🎭 Installation des navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: 🚀 Lancement du Scraper
        run: node scraper.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: 💾 Sauvegarde du Backlog Infini
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backlog_pokemon.json
          if git diff-index --quiet HEAD; then
            echo "Aucun changement détecté, pas de commit"
          else
            git commit -m "📝 Maj Backlog : Nouveaux événements détectés"
          fi
          git push

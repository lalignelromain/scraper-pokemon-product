name: Pokemon Scraper

on:
  schedule:
    - cron: '*/10 6-9 * * *'
    - cron: '*/30 14-20 * * *'
  workflow_dispatch:

# On donne explicitement le droit au bot de sauvegarder le fichier json à la fin
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # On revient au checkout standard (sans le token qui fait planter)
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Scraper
        run: node src/index.js
        env:
          NTFY_TOPIC_CARTE: ${{ secrets.NTFY_TOPIC_CARTE }}
          NTFY_TOPIC_ETB: ${{ secrets.NTFY_TOPIC_ETB }}
          NTFY_TOPIC_COFFRET: ${{ secrets.NTFY_TOPIC_COFFRET }}
          NTFY_TOPIC_BUNDLE_BLISTER: ${{ secrets.NTFY_TOPIC_BUNDLE_BLISTER }}
          NTFY_TOPIC_30ANS: ${{ secrets.NTFY_TOPIC_30ANS }}
          
      # NOUVELLE ÉTAPE : Sauvegarde de la mémoire des stocks
      - name: Save State to GitHub
        run: |
          git config --global user.name "Scraper Bot"
          git config --global user.email "bot@scraper.local"
          git add stock_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour des stocks [skip ci]"
          git push

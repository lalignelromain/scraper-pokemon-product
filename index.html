<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Tactical Radar - Command Center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            color: #38bdf8;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .kpi-value {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .kpi-value.green { color: var(--accent-green); }
        .kpi-value.red { color: var(--accent-red); }
        
        .grid-stores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .store-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .store-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-row {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .product-title {
            font-weight: bold;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge.online { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge.rupture { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .stats-detail {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Pokémon Tactical Radar</h1>
        <div class="subtitle">Tableau de bord opérationnel & Surveillance en temps réel (Objectif 02/10)</div>
    </header>

    <div id="app">
        <div class="loading">Chargement des données du sous-marin...</div>
    </div>

    <script>
        async function loadData() {
            try {
                // Anti-cache grâce à timestamp
                const response = await fetch('backlog_pokemon.json?' + new Date().getTime());
                if (!response.ok) throw new Error("Impossible de récupérer le fichier backlog_pokemon.json");
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div style="text-align: center; color: var(--accent-red); padding: 40px;">
                        <h3>⚠️ Erreur de chargement du radar</h3>
                        <p>${error.message}</p>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">Vérifiez que le fichier backlog_pokemon.json existe à la racine du dépôt.</p>
                    </div>
                `;
            }
        }

        function renderDashboard(data) {
            const app = document.getElementById('app');
            
            let totalStores = Object.keys(data).length;
            let activeDrops = 0;
            let lastUpdate = "N/A";

            // Analyse globale pour les KPIs
            for (const [store, products] of Object.entries(data)) {
                for (const [prodKey, info] of Object.entries(products)) {
                    if (info.etat_actuel) {
                        activeDrops++;
                    }
                    if (info.derniere_modification && info.derniere_modification !== "N/A") {
                        if (lastUpdate === "N/A" || info.derniere_modification > lastUpdate) {
                            lastUpdate = info.derniere_modification;
                        }
                    }
                }
            }

            let html = `
                <div class="kpi-container">
                    <div class="kpi-card">
                        <div class="subtitle">Enseignes surveillées</div>
                        <div class="kpi-value">${totalStores}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="subtitle">Cibles en ligne (Actifs)</div>
                        <div class="kpi-value ${activeDrops > 0 ? 'green' : 'red'}">${activeDrops}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="subtitle">Dernière activité radar</div>
                        <div class="kpi-value" style="font-size: 1.1rem; margin-top: 15px;">${lastUpdate}</div>
                    </div>
                </div>

                <div class="grid-stores">
            `;

            for (const [storeName, products] of Object.entries(data)) {
                html += `
                    <div class="store-card">
                        <div class="store-name">
                            <span>${storeName}</span>
                        </div>
                `;

                if (!products || Object.keys(products).length === 0) {
                    html += `<div class="stats-detail" style="padding: 10px 0;">En attente de premier scan...</div>`;
                } else {
                    for (const [prodKey, info] of Object.entries(products)) {
                        const badgeClass = info.etat_actuel ? 'online' : 'rupture';
                        html += `
                            <div class="product-row">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="product-title">${prodKey}</span>
                                    <span class="badge ${badgeClass}">${info.statut}</span>
                                </div>
                                <div class="stats-detail">
                                    Compteur apparitions : <strong>${info.compteur_apparitions}</strong><br>
                                    Dernière apparition : ${info.derniere_apparition}<br>
                                    Dernière disparition : ${info.derniere_disparition}
                                </div>
                            </div>
                        `;
                    }
                }

                html += `</div>`;
            }

            html += `</div>`;
            app.innerHTML = html;
        }

        // Chargement immédiat, puis actualisation automatique toutes les 60 secondes
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>

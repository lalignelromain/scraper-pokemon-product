<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Tactical Radar - Command Center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            color: var(--accent-blue);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filters {
            display: flex;
            gap: 10px;
        }
        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-blue);
            color: var(--bg-color);
            border-color: var(--accent-blue);
        }
        .refresh-btn {
            background-color: #334155;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:hover {
            background-color: #475569;
        }
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .kpi-value {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 5px;
        }
        .kpi-value.green { color: var(--accent-green); }
        .kpi-value.red { color: var(--accent-red); }
        .kpi-value.blue { color: var(--accent-blue); }
        
        .grid-stores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .store-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .store-card.has-active {
            border-color: var(--accent-green);
        }
        .store-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-row {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .product-title {
            font-weight: bold;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge.online { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge.rupture { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .stats-detail {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Pokémon Tactical Radar</h1>
        <div class="subtitle">Poste de commandement avancé — Objectif 02/10</div>
    </header>

    <div class="toolbar">
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">Toutes les enseignes</button>
            <button class="filter-btn" onclick="setFilter('online', this)">🟢 En ligne uniquement</button>
            <button class="filter-btn" onclick="setFilter('active', this)">📊 Historique actif (>0)</button>
        </div>
        <button class="refresh-btn" onclick="loadData()">
            🔄 Forcer le rafraîchissement
        </button>
    </div>

    <div id="app">
        <div class="loading">Connexion au sous-marin en cours...</div>
    </div>

    <script>
        let globalData = null;
        let currentFilter = 'all';

        async function loadData() {
            const app = document.getElementById('app');
            try {
                const response = await fetch('backlog_pokemon.json?' + new Date().getTime());
                if (!response.ok) throw new Error("Impossible de récupérer le fichier backlog_pokemon.json");
                globalData = await response.json();
                renderDashboard();
            } catch (error) {
                app.innerHTML = `
                    <div style="text-align: center; color: var(--accent-red); padding: 40px;">
                        <h3>⚠️ Erreur de liaison avec le radar</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            if (!globalData) return;
            const app = document.getElementById('app');
            
            let totalStores = Object.keys(globalData).length;
            let activeDrops = 0;
            let storesWithHistory = 0;
            let lastUpdate = "N/A";

            // Calculs KPIs globaux
            for (const [store, products] of Object.entries(globalData)) {
                let storeHasActivity = false;
                for (const [prodKey, info] of Object.entries(products)) {
                    if (info.etat_actuel) {
                        activeDrops++;
                        storeHasActivity = true;
                    }
                    if (info.compteur_apparitions > 0) {
                        storeHasActivity = true;
                    }
                    if (info.derniere_modification && info.derniere_modification !== "N/A") {
                        if (lastUpdate === "N/A" || info.derniere_modification > lastUpdate) {
                            lastUpdate = info.derniere_modification;
                        }
                    }
                }
                if (storeHasActivity) storesWithHistory++;
            }

            let html = `
                <div class="kpi-container">
                    <div class="kpi-card">
                        <div class="subtitle">Enseignes sous surveillance</div>
                        <div class="kpi-value blue">${totalStores}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="subtitle">Cibles en ligne (Actifs)</div>
                        <div class="kpi-value ${activeDrops > 0 ? 'green' : 'red'}">${activeDrops}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="subtitle">Enseignes "bavardes" (Historique)</div>
                        <div class="kpi-value blue">${storesWithHistory} / ${totalStores}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="subtitle">Dernier mouvement capté</div>
                        <div class="kpi-value" style="font-size: 1rem; margin-top: 15px; color: #cbd5e1;">${lastUpdate}</div>
                    </div>
                </div>

                <div class="grid-stores">
            `;

            for (const [storeName, products] of Object.entries(globalData)) {
                // Application des filtres
                let storeHasOnline = false;
                let storeHasActivity = false;
                
                if (products) {
                    for (const info of Object.values(products)) {
                        if (info.etat_actuel) storeHasOnline = true;
                        if (info.compteur_apparitions > 0) storeHasActivity = true;
                    }
                }

                if (currentFilter === 'online' && !storeHasOnline) continue;
                if (currentFilter === 'active' && !storeHasActivity) continue;

                html += `
                    <div class="store-card ${storeHasOnline ? 'has-active' : ''}">
                        <div class="store-name">
                            <span>${storeName}</span>
                            ${storeHasOnline ? '<span class="badge online">ACTIF</span>' : ''}
                        </div>
                `;

                if (!products || Object.keys(products).length === 0) {
                    html += `<div class="stats-detail" style="padding: 10px 0;">En attente de premier scan...</div>`;
                } else {
                    for (const [prodKey, info] of Object.entries(products)) {
                        const badgeClass = info.etat_actuel ? 'online' : 'rupture';
                        html += `
                            <div class="product-row">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span class="product-title">${prodKey}</span>
                                    <span class="badge ${badgeClass}">${info.statut}</span>
                                </div>
                                <div class="stats-detail">
                                    Compteur apparitions : <strong>${info.compteur_apparitions}</strong><br>
                                    Dernière apparition : ${info.derniere_apparition}<br>
                                    Dernière disparition : ${info.derniere_disparition}
                                </div>
                            </div>
                        `;
                    }
                }

                html += `</div>`;
            }

            html += `</div>`;
            app.innerHTML = html;
        }

        // Chargement initial
        loadData();
    </script>
</body>
</html>
